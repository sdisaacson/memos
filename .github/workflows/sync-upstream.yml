name: Sync Upstream and Update custom-clerk

# Keeps the fork's `custom-clerk` branch current with usememos/memos, then merges the
# updated custom-clerk into `custom-clerk` so the Clerk customization branch stays
# up to date with upstream Memos.
on:
  schedule:
    # 3am Eastern: 07:00 UTC during EDT, 02:00 UTC during EST.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync custom-clerk from upstream, merge into custom-clerk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom-clerk
        uses: actions/checkout@v6
        with:
          ref: custom-clerk
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/usememos/memos.git
          git fetch upstream custom-clerk

      - name: Merge upstream into custom-clerk
        # custom-clerk carries this workflow file, so it is one commit ahead of
        # upstream and a plain merge (not --ff-only) is required. Exits 0
        # with "Already up to date" when there is nothing new.
        run: git merge --no-edit upstream/custom-clerk

      - name: Push custom-clerk
        run: git push origin custom-clerk

      - name: Merge custom-clerk into custom-clerk
        run: |
          git fetch origin custom-clerk
          git checkout custom-clerk
          git merge --no-edit origin/custom-clerk

      - name: Push custom-clerk
        run: git push origin custom-clerk
